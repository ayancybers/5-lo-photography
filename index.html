<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="relax">
<head>
    <script>
        try {
            const validThemes = ['saudi', 'relax', 'dark', 'light'];
            const initialized = localStorage.getItem('site_theme_initialized');


            if (initialized !== '1') {
                localStorage.setItem('site_theme', 'relax');
                localStorage.setItem('theme_label_ar', 'الوضع الهادئ 🍃');
                localStorage.setItem('theme_label_en', 'Relax');
                localStorage.setItem('site_theme_initialized', '1');
            }

            const savedTheme = localStorage.getItem('site_theme');
            const initialTheme = validThemes.includes(savedTheme) ? savedTheme : 'relax';
            document.documentElement.setAttribute('data-theme', initialTheme);
        } catch (_) {
            document.documentElement.setAttribute('data-theme', 'relax');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cinematic Car Photographer 🎥 — استوديو تصوير السيارات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    
    <link rel="stylesheet" href="style.css">
</head>
<body id="top" class="page-home">

    
    <div id="site-header"></div>

    
    <main>
        <section class="hero-section">
            <video class="hero-video" autoplay muted loop playsinline webkit-playsinline preload="auto" aria-label="5lo Studio cinematic showreel" aria-hidden="true">
                <source src="https://e.top4top.io/m_3914dpfih6.mp4" type="video/mp4">
            </video>
            <div class="container">
                <span class="badge" data-i18n="hero_badge">استوديو تصوير السيارات — الدمام، الخبر، والقطيف</span>
                <h1 data-i18n="hero_title">خلِّ سيارتك <span style="color: var(--accent);">تتحرك</span> حتى وهي ثابتة.</h1>
                <p data-i18n="hero_desc">نصنع للسيارات حضوراً يُرى ويُحس. صورة دقيقة، فيلم قصير بإيقاعه، وذاكرة تستحق أن تُحفظ.</p>
                
                <div style="display: flex; gap: 16px; flex-wrap: wrap; margin-top: 24px;">
                    <a href="packages.html#contact" class="btn-main" data-i18n="btn_start">ابدأ مشروعك</a>
                    <a href="works.html" class="btn-sec" data-i18n="btn_works">استعرض الأعمال</a>
                </div>
            </div>
        </section>

        
    </main>

    
    <div id="site-footer"></div>

    
    <script src="main.js"></script>

    
    <script>
        const loaderHTML = `
            <div id="loader-wrapper">
                <div class="loader-content">
                    <div class="loader-circle"></div>
                    <img src="https://l.top4top.io/p_391495qim1.png" alt="Cinematic Car Photographer 🎥" class="loader-logo">
                </div>
                <div class="loader-info">
                    <div class="loader-percentage" id="loaderPercentage">0%</div>
                    <div class="loader-message" id="loaderMessage" data-i18n="load_msg_1">جاري تهيئة الاستوديو وتحميل عناصر الصفحة...</div>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('afterbegin', loaderHTML);

        window.addEventListener('load', () => {
            let percent = 0;
            const percentEl = document.getElementById('loaderPercentage');
            const msgEl = document.getElementById('loaderMessage');
            const loader = document.getElementById('loader-wrapper');

            const interval = setInterval(() => {
                percent += Math.floor(Math.random() * 12) + 8;
                if (percent >= 100) {
                    percent = 100;
                    clearInterval(interval);
                    setTimeout(() => {
                        if (loader) {
                            loader.classList.add('loader-hidden');
                        }
                    }, 300);
                }

                if (percentEl) percentEl.textContent = percent + '%';

                if (msgEl) {
                    if (percent > 65) {
                        msgEl.textContent = translations[currentLang]['load_msg_3'] || 'كل شيء جاهز تقريباً، استعد للانطلاق! 🚀';
                    } else if (percent > 35) {
                        msgEl.textContent = translations[currentLang]['load_msg_2'] || 'جاري تجهيز مقاطع الفيديو والسينمائيات...';
                    }
                }
            }, 70);
        });
    </script>
</body>
</html>
