<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5lo Photography | Soon </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 150, 255, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: rgba(22, 24, 31, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 1;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px auto;
            font-size: 32px;
            color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
            animation: pulse 2.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(59, 130, 246, 0.4); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); }
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            color: #a1a1aa;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
            line-height: 1.4;
        }

        p {
            font-size: 15px;
            color: #9ca3af;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 24px;
            background-color: #25d366;
            color: #ffffff;
            text-decoration: none;
            font-size: 17px;
            font-weight: 700;
            border-radius: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.25);
        }

        .btn-whatsapp:hover {
            background-color: #20bd5a;
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(37, 211, 102, 0.35);
        }

        .btn-whatsapp:active {
            transform: translateY(0);
        }

        .btn-whatsapp i {
            font-size: 22px;
        }

        .footer-text {
            margin-top: 25px;
            font-size: 13px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-box">
            <i class="fa-solid fa-wrench"></i>
        </div>

        <div class="badge">
            <i class="fa-solid fa-arrows-rotate fa-spin" style="margin-left: 6px;"></i> تحديثات مستمرة
        </div>

        <h1>الموقع تحت الصيانة حالياً</h1>
        
        <p>نعمل على إضافة التحديث الجديد لتقديم تجربة أفضل لكم.<br>لجلسات حجز التصوير والطلبات المستعجلة، يرجى التواصل معنا مباشرة عبر الواتساب.</p>

        <a href="https://wa.me/966597561765" target="_blank" class="btn-whatsapp">
            <i class="fa-brands fa-whatsapp"></i>
            الحجز عبر الواتساب
        </a>

        <div class="footer-text">
            شكراً لانتظاركم وتفهمكم 🖤
        </div>
    </div>

</body>
</html>
